@media(hover:hover) and (pointer:fine){.feature-card,.example-row,.element-card,.glass,.glass-control,.metric,.answer{will-change:transform;transition:transform .42s cubic-bezier(.16,1,.3,1),box-shadow .42s,border-color .3s,background .3s}.feature-card{transform-style:preserve-3d}.feature-card:before{content:"";position:absolute;z-index:0;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(340px circle at var(--pointer-x,50%) var(--pointer-y,50%),rgba(139,105,235,.19),transparent 68%);opacity:0;transition:opacity .35s}.feature-card.pointer-hover{z-index:4;transform:perspective(900px) translateY(-7px) scale(1.025) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));border-color:#c7b4f4;box-shadow:0 24px 48px #32205228}.feature-card.pointer-hover:before{opacity:1}.feature-card.pointer-hover .feature-icon{transform:translateZ(20px) scale(1.13) rotate(-5deg);transition:transform .42s cubic-bezier(.16,1,.3,1)}.example-row.pointer-hover{z-index:3;position:relative;transform:translateX(5px) scale(1.015);background:radial-gradient(220px circle at var(--pointer-x,50%) var(--pointer-y,50%),#eee6ff,white 78%);box-shadow:0 8px 18px #35205012}.element-card.pointer-hover{z-index:6;position:relative;transform:perspective(500px) translateY(-4px) scale(1.22) rotateX(var(--tilt-x,0deg)) rotateY(var(--tilt-y,0deg));box-shadow:0 10px 25px #39225d3b;border-color:#9d7be8}.element-card.pointer-hover:after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(80px circle at var(--pointer-x,50%) var(--pointer-y,50%),#ffffffa0,transparent 70%);pointer-events:none}.glass.pointer-hover,.glass-control.pointer-hover{transform:translateY(-2px) scale(1.06);box-shadow:0 12px 26px #39225d20,inset 0 1px #fff}.metric.pointer-hover,.answer.pointer-hover{transform:translateY(-4px) scale(1.015);box-shadow:0 12px 24px #32205218}}
@keyframes premiumReveal{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}.element-detail{animation:premiumReveal .42s cubic-bezier(.16,1,.3,1)}.element-card.selected{animation:elementSelect .35s cubic-bezier(.16,1,.3,1)}@keyframes elementSelect{50%{transform:scale(1.08)}}.calc-result:not([hidden]),.balance-result:not([hidden]){animation:premiumReveal .36s cubic-bezier(.16,1,.3,1)}.structure-canvas svg{animation:premiumReveal .42s cubic-bezier(.16,1,.3,1)}
@media(prefers-reduced-motion:reduce){.feature-card,.example-row,.element-card,.glass,.glass-control,.metric,.answer,.feature-icon,.element-detail,.calc-result,.balance-result,.structure-canvas svg{animation:none!important;transition:none!important;transform:none!important}.feature-card:before,.element-card.pointer-hover:after{display:none!important}}

function statCard(label,id,unit=''){return `<div class="metric-card"><span>${label}</span><b id="${id}">—</b><small>${unit}</small></div>`}
function homePage(){return `<section class="page-heading welcome-row"><div><div class="eyebrow">YOUR CHEMISTRY WORKSPACE</div><h1>Good science starts<br>with a <em>structure.</em></h1><p class="intro">Explore molecules, understand their properties, and turn chemistry into something you can see.</p></div><span class="date-chip">Molecular learning studio</span></section><section class="hero-lab"><div class="hero-copy"><div class="eyebrow">MOLECULAR EXPLORER <span class="pill">READY</span></div><h2>Bring a molecule<br>into focus.</h2><p>Start with a SMILES string or choose a familiar molecule. Forma maps its structure and calculates key properties.</p><button class="primary" data-go="visualizer">Open the visualizer <span>↗</span></button><small>⌑ Calculations run locally in your browser</small></div><div class="hero-visual"><div class="glow"></div><div class="orbit o1"></div><div class="orbit o2"></div><div class="atom a1">C</div><div class="atom a2">O</div><div class="atom a3">C</div><div class="atom a4">H</div><div class="bond bond1"></div><div class="bond bond2"></div><div class="bond bond3"></div><div class="model-caption"><span>MOLECULAR MODEL</span><b>03 atoms · 02 bonds</b></div></div></section><div class="section-title"><div><div class="eyebrow">YOUR WORKBENCH</div><h2>Pick up where curiosity leads.</h2></div><small>10 learning spaces</small></div><section class="feature-grid"><button class="feature-card feature-main" data-go="visualizer"><span>01 / SEE IT</span><i class="feature-icon mint">⌬</i><h3>Molecular<br>visualizer</h3><p>Translate SMILES into a clear 2D structure and interactive 3D model.</p><b class="arrow">↗</b></button><button class="feature-card" data-go="properties"><span>02 / MEASURE</span><i class="feature-icon blue">▤</i><h3>Properties</h3><p>Explore molecular weight, LogP, TPSA, and more.</p><b class="arrow">↗</b></button><button class="feature-card" data-go="compare"><span>03 / COMPARE</span><i class="feature-icon lilac">⌁</i><h3>Structure &<br>property</h3><p>Compare a set of molecules side by side.</p><b class="arrow">↗</b></button><button class="feature-card" data-go="theory"><span>04 / LEARN</span><i class="feature-icon gold">▧</i><h3>Build your<br>foundation</h3><p>Learn how SMILES and molecular descriptors work.</p><b class="arrow">↗</b></button></section><div class="section-title"><div><div class="eyebrow">MORE CHEMISTRY TOOLS</div><h2>Explore beyond molecules.</h2></div></div><section class="feature-grid"><button class="feature-card" data-go="periodic"><span>05 / REFERENCE</span><i class="feature-icon lilac">⊞</i><h3>Periodic table</h3><p>Search all 118 elements and inspect key properties.</p><b class="arrow">↗</b></button><button class="feature-card" data-go="solutions"><span>06 / CALCULATE</span><i class="feature-icon blue">∑</i><h3>Solutions</h3><p>Work through molarity and dilution calculations.</p><b class="arrow">↗</b></button><button class="feature-card" data-go="balancer"><span>07 / REACTIONS</span><i class="feature-icon gold">⇌</i><h3>Equation balancer</h3><p>Balance neutral chemical equations and inspect atom counts.</p><b class="arrow">↗</b></button></section><div class="section-title"><div><div class="eyebrow">A FEW GOOD STARTING POINTS</div><h2>Example molecules</h2></div><button class="text-button" data-go="visualizer">Explore all →</button></div><section class="example-list">${examples.map((x,i)=>`<button class="example-row" data-smiles="${esc(x.smiles)}"><i class="example-dot ${x.color}">${['C','⌬','O','C','A','N'][i%6]}</i><span><b>${x.name}</b><small>${x.smiles}</small></span><span class="row-arrow">↗</span></button>`).join('')}</section><footer class="footer"><span>FORMA MOLECULAR STUDIO</span><span>Built for curious minds · Educational estimates</span></footer>`}
function theoryPage(){return `<div class="page-heading"><div class="eyebrow">THE CHEMISTRY BEHIND THE SCREEN</div><h1>Learn the language<br>of <em>molecules.</em></h1><p class="intro">A short field guide to the ideas Forma helps you explore.</p></div><div class="theory-layout"><div><article class="lesson"><span>01</span><div><div class="eyebrow">FOUNDATIONS</div><h2>What is cheminformatics?</h2><p>Cheminformatics brings chemistry, computer science, and data analysis together. It gives us ways to represent, store, visualize, and reason about chemical structures.</p><div class="chips"><b>⚗ Chemistry</b><b>⌘ Computing</b><b>◫ Data</b></div></div></article><article class="lesson"><span>02</span><div><div class="eyebrow">A TEXTUAL STRUCTURE</div><h2>SMILES, in plain language.</h2><p>SMILES means <b>Simplified Molecular Input Line Entry System.</b> It encodes atoms and bonds as a readable string.</p><div class="smiles-examples">${examples.slice(0,3).map(m=>`<div><span>${m.name}</span><code>${m.smiles}</code></div>`).join('')}</div><div class="callout">Parentheses indicate branches; ring numbers connect atoms that close a ring.</div></div></article><article class="lesson"><span>03</span><div><div class="eyebrow">NUMBERS WITH MEANING</div><h2>Molecular descriptors.</h2><p>Descriptors turn aspects of a structure into numbers that can be compared.</p><div class="descriptor-list">${[['Molecular weight','Approximate mass of a molecule'],['LogP','A model of lipophilicity'],['TPSA','Topological polar surface area'],['HBD / HBA','Hydrogen bond donors / acceptors'],['Rotatable bonds','A count of selected flexible bonds']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div></article><article class="lesson"><span>04</span><div><div class="eyebrow">SHAPE & SPACE</div><h2>Ways to see a molecule.</h2><div class="descriptor-list">${[['Ball and stick','Atoms as spheres, bonds as connectors'],['Stick','Emphasizes the bond network'],['Space filling','Shows approximate molecular volume'],['Wireframe','A simplified bond representation']].map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div><button class="text-button" data-go="visualizer">Explore a 3D model →</button></div></article></div><aside class="theory-aside"><div class="eyebrow">IN THIS GUIDE</div><a href="#">01　Cheminformatics</a><a href="#">02　SMILES</a><a href="#">03　Descriptors</a><a href="#">04　3D models</a><div class="callout">Ready to try it?<p>Put a SMILES string into the visualizer and watch it take shape.</p><button class="text-button" data-go="visualizer">Open visualizer →</button></div></aside></div><footer class="footer">FORMA MOLECULAR STUDIO <span>Educational use</span></footer>`}
function visualizerPage(){return `<div class="page-heading heading-row"><div><div class="eyebrow">MOLECULE WORKBENCH · 01</div><h1>Make structure <em>visible.</em></h1><p class="intro">Type any valid SMILES string or choose an example to inspect its structure and explore a 3D model.</p></div><span class="valid-chip" id="validChip"><i></i><span>Waiting for a molecule</span></span></div><section class="input-panel"><div class="input-head"><label for="smilesInput">MOLECULAR INPUT <small>SMILES</small></label><button class="text-button" id="clearSmiles">Clear</button></div><div class="input-row"><div class="smiles-input"><span>⌬</span><input id="smilesInput" value="CCO" spellcheck="false" placeholder="Type a SMILES string…"><button id="copySmiles" title="Copy SMILES">▢</button></div><small>OR</small><select id="exampleSelect" class="glass-control">${examples.map(m=>`<option value="${esc(m.smiles)}">${m.name}</option>`).join('')}</select><button class="secondary" id="loadExample">Load example</button><button class="primary" id="analyzeSmiles">Analyze molecule</button></div><div class="input-foot"><span id="inputStatus">Type any valid SMILES and press Enter or tap Analyze</span><span>18 ready-to-use examples</span></div><div id="moleculeError" class="error" hidden>That SMILES string could not be parsed. Check atom symbols, bonds, and parentheses.</div></section><div id="engineError" class="error" hidden>Chemistry engine unavailable. Connect to the internet and reload; the RDKit module is required.</div><div class="visual-grid"><section class="surface-panel"><div class="panel-head"><div><div class="eyebrow">2D DEPICTION</div><h2>Molecular structure</h2></div><button class="secondary" id="fullscreen2d">⤢ Expand</button></div><div class="structure-canvas" id="structureCanvas"><span>⌬</span><p>Your structure will appear here</p></div><div class="structure-foot"><span id="canonical">Canonical SMILES · —</span><button class="text-button" id="downloadSvg">Export image ↓</button></div></section><section class="surface-panel info-panel"><div class="panel-head"><div><div class="eyebrow">AT A GLANCE</div><h2>Molecule profile</h2></div><span class="profile-mark">⌘</span></div><div class="formula"><small>MOLECULAR FORMULA</small><b id="formula">—</b></div><div class="quick-stats"><div>Atoms<b id="atoms">—</b></div><div>Heavy atoms<b id="heavyAtoms">—</b></div><div>Bonds<b id="bonds">—</b></div><div>Rings<b id="rings">—</b></div></div><div class="mini-stat">Molecular weight <b id="mw">—</b></div><div class="mini-stat">LogP <b id="logp">—</b></div><div class="mini-stat">TPSA <b id="tpsa">—</b></div><button class="text-button" data-go="properties">See complete properties →</button></section></div><section class="viewer-panel"><div class="panel-head viewer-head"><div><div class="eyebrow">INTERACTIVE MODEL</div><h2>Explore in three dimensions.</h2><p>Rotate, zoom, and change how atoms and bonds appear.</p></div><div class="viewer-controls"><select id="modelStyle" class="glass-control"><option value="ball">Ball and stick</option><option value="stick">Stick</option><option value="sphere">Space filling</option><option value="line">Wireframe</option></select><label class="toggle"><input type="checkbox" id="surface"><span></span>Surface</label><button class="primary" id="generate3d">Generate 3D model ↗</button></div></div><div class="viewer-consent"><label><input type="checkbox" id="pubchemConsent"><span>Allow sending this SMILES to PubChem for 3D coordinates</span></label><small>Only sent when you generate a model; structure analysis stays in this browser.</small></div><div class="viewer-stage" id="viewerStage"><div id="viewerCanvas" hidden></div><div id="viewerEmpty" class="viewer-empty"><div class="viewer-orbit">⌬</div><b>Your molecule, from every angle.</b><p>Generate a 3D conformer to begin exploring.</p><button class="secondary" id="viewerGenerate">Generate model ↗</button></div><div id="viewerWait" class="viewer-wait" hidden><i class="spinner"></i><b>Preparing the 3D model…</b><small>Looking up a conformer</small></div><div id="viewerError" class="error" hidden></div></div><div class="viewer-foot">Touch and drag to rotate · pinch or scroll to zoom <span>3D conformer lookup requires internet</span></div></section><footer class="footer">FORMA MOLECULAR STUDIO <span>Calculated with RDKit · Educational estimates</span></footer>`}
function propertiesPage(){return `<div class="page-heading"><div class="eyebrow">A CLOSER LOOK · 02</div><h1>The details behind<br>the <em>molecule.</em></h1><p class="intro">Explore a complete profile from a validated molecular structure.</p></div><section class="input-panel"><div class="input-head"><label for="propInput">MOLECULAR INPUT <small>SMILES</small></label><button class="text-button" id="loadPropExample">Use ethanol</button></div><div class="input-row"><div class="smiles-input"><span>⌬</span><input id="propInput" value="${esc(lastAnalysis?.smiles||'CCO')}" spellcheck="false"></div><button class="primary" id="analyzeProperties">Analyze molecule ↗</button></div><div id="propError" class="error" hidden>Could not parse this SMILES string.</div></section><div class="report-overview"><section class="surface-panel"><div class="panel-head"><div><div class="eyebrow">STRUCTURE</div><h2 id="propName">${lastAnalysis?.name||'Ethanol'}</h2></div><span class="valid-label">Valid structure</span></div><div id="propSvg" class="property-svg"></div><div class="structure-foot">CANONICAL SMILES <code id="propCanonical">${esc(lastAnalysis?.canonical||'CCO')}</code></div></section><section><div class="metric-grid">${[['Molecular weight','rMw','g/mol'],['LogP','rLogp','lipophilicity estimate'],['TPSA','rTpsa','Å² · polar surface'],['H-bond donors','rHbd','HBD'],['H-bond acceptors','rHba','HBA'],['Rotatable bonds','rRotors','flexible bonds'],['Ring count','rRings','molecular rings'],['Fraction Csp³','rCsp3','sp³ carbon fraction']].map(x=>`<div class="metric"><small>${x[0]}</small><b id="${x[1]}">—</b><span>${x[2]}</span></div>`).join('')}</div></section></div><section class="table-section"><div class="section-title"><div><div class="eyebrow">FULL PROFILE</div><h2>Complete property table</h2></div><button class="secondary" id="downloadProperties">Download CSV ↓</button></div><div class="table-wrap"><table><thead><tr><th>PROPERTY</th><th>VALUE</th><th>WHAT IT TELLS YOU</th></tr></thead><tbody id="propertyRows"></tbody></table></div></section><footer class="footer">FORMA MOLECULAR STUDIO <span>Calculated with RDKit · Educational estimates</span></footer>`}
function comparePage(){return `<div class="page-heading"><div class="eyebrow">PATTERNS ACROSS STRUCTURES · 03</div><h1>Compare the <em>chemistry.</em></h1><p class="intro">Place molecules side by side and notice how structural changes shift their properties.</p></div><div class="compare-layout"><section class="surface-panel compare-input"><div class="panel-head"><div><div class="eyebrow">YOUR MOLECULE SET</div><h2>One molecule per line</h2></div><span class="count" id="compareCount">5 molecules</span></div><p>Use the format <code>Name, SMILES</code>. Add or remove a line; the table updates automatically.</p><textarea id="compareInput" rows="8" spellcheck="false">${initialCompare}</textarea><div class="input-foot"><span>Each line is checked independently</span><button class="text-button" id="resetCompare">Reset examples ↺</button></div></section><aside class="insight"><div class="eyebrow">A QUESTION TO EXPLORE</div><h3>What changes when an oxygen enters the structure?</h3><p>Compare polarity and hydrogen bonding across your set. Small structural edits can make measurable differences.</p><span>TRY IT WITH YOUR MOLECULES</span></aside></div><section class="table-section"><div class="section-title"><div><div class="eyebrow">SIDE BY SIDE</div><h2>Comparison table</h2><p>Calculated values for valid input structures.</p></div><button class="secondary" id="downloadCompare">Download CSV ↓</button></div><div id="compareErrors" class="compare-errors"></div><div class="table-wrap"><table class="wide-table"><thead><tr><th>MOLECULE</th><th>FORMULA</th><th>MW</th><th>LOGP</th><th>TPSA</th><th>HBD</th><th>HBA</th><th>ROTORS</th><th>RINGS</th></tr></thead><tbody id="compareRows"></tbody></table></div></section><footer class="footer">FORMA MOLECULAR STUDIO <span>Calculated with RDKit · Educational estimates</span></footer>`}

function bindGlobal(){bindPremiumHover();document.addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b){const id=b.dataset.page;if(current===id){$('.nav-item.active')?.classList.add('pressed')}else{current=id;render()}return}const go=e.target.closest('[data-go]');if(go){current=go.dataset.go;render()}});document.addEventListener('click',e=>{if(e.target.closest('#analyzeSmiles'))analyze($('#smilesInput').value,'visualizer')});let holdTimer;document.addEventListener('pointerdown',e=>{const item=e.target.closest('.nav-item');if(!item)return;holdTimer=setTimeout(()=>{item.classList.add('holding');const nav=$('#nav');nav.classList.toggle('nav-expanded');notify(nav.classList.contains('nav-expanded')?'Navigation shortcuts revealed':'Navigation compact');},520)});['pointerup','pointercancel','pointerleave'].forEach(ev=>document.addEventListener(ev,e=>{clearTimeout(holdTimer);e.target?.closest?.('.nav-item')?.classList.remove('holding')}));$('#menuToggle').onclick=()=>{$('#sidebar').classList.toggle('open');$('#shade').classList.toggle('show')};$('#shade').onclick=()=>{$('#sidebar').classList.remove('open');$('#shade').classList.remove('show')};$('#theme').onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem('formaDark',document.body.classList.contains('dark'));if(viewer){viewer.setBackgroundColor(document.body.classList.contains('dark')?'#191520':'#fffaff');viewer.render()}};if(localStorage.getItem('formaDark')==='true')document.body.classList.add('dark');$('#student').value=localStorage.getItem('formaName')||'';$('#studentId').value=localStorage.getItem('formaId')||'';$('#student').oninput=e=>{localStorage.setItem('formaName',e.target.value);if(current==='report')updateReport()};$('#studentId').oninput=e=>{localStorage.setItem('formaId',e.target.value);if(current==='report')updateReport()};document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;const i=e.key==="0"?9:Number(e.key)-1;if(pages[i]){current=pages[i][0];render()}})}
document.querySelector("#profileButton").addEventListener("click",()=>{const sidebar=document.querySelector("#sidebar");if(matchMedia("(max-width:760px)").matches){sidebar.classList.add("open");document.querySelector("#shade").classList.add("show")}document.querySelector("#student").scrollIntoView({behavior:"smooth",block:"center"});setTimeout(()=>document.querySelector("#student").focus({preventScroll:true}),180)});bindGlobal();render();initRDKit();
